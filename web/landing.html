<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<!-- Bezpečnost: GitHub Pages neumí hlavičky (_headers platí jen na Netlify), proto CSP i tady -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- Ochrana proti vložení stránky do cizího rámečku (clickjacking) – frame-ancestors v <meta> nefunguje -->
<style id="antiClickjack">html{display:none!important}</style>
<script>if (self === top) { var ac = document.getElementById('antiClickjack'); ac.parentNode.removeChild(ac); } else { top.location = self.location; }</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Jedna šablona pro všechny klienty a akce:
 *   /cez            → přehled akcí klienta
 *   /cez/dukovany   → registrace na konkrétní akci
 * Čisté adresy přesměruje hosting na tento soubor (web/_redirects, web/404.html).
 * Záložní tvar bez přesměrování: landing.html?c=cez&e=dukovany
 * APP_BASE = složka, ve které web běží (na doméně "/"; v podsložce např. "/eventy/"). */
(function () {
  // GitHub Pages projektu běží v podsložce (uzivatel.github.io/nazev-repa/) – pozná se samo
  var p = location.pathname, i = p.lastIndexOf('/landing.html');
  var APP_BASE = /\.github\.io$/.test(location.hostname) && p.split('/')[1] ? '/' + p.split('/')[1] + '/' : '/';
  var root = (i >= 0 || location.protocol === 'file:') ? p.slice(0, p.lastIndexOf('/') + 1) : APP_BASE;
  document.write('<base href="' + root + '">');
  window.LANDING_ROUTE = (function () {
    var q = new URLSearchParams(location.search);
    if (q.get('c')) return { client: q.get('c'), event: q.get('e') || '' };
    var rel = decodeURIComponent(p).slice(root.length).replace(/^\/+|\/+$/g, '').split('/');
    return { client: rel[0] || '', event: rel[1] || '' };
  })();
})();
</script>
<title>Registrace</title>
<meta name="theme-color" content="#1E1F2E">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="styles.css">
<style>
body { background: var(--gray); }
.page-state { min-height: 60vh; display: grid; place-items: center; text-align: center; padding: 48px var(--pad); }
.page-state h1 { font: 600 34px/1.15 var(--sans); letter-spacing: -.02em; margin: 16px 0 10px; }
.page-state p { color: var(--muted); max-width: 46ch; margin: 0 auto; }
.site-head .back { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; }
.site-head .back:hover { color: var(--brand); }
.site-head .back svg { width: 16px; height: 16px; }

/* ---------- HERO (tmavý, světelné přechody v barvách pořadatele) ---------- */
.hero { position: relative; overflow: hidden; background: var(--dark); color: #fff; isolation: isolate; }
.hero::before, .hero::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; filter: blur(90px); opacity: .32; pointer-events: none; }
.hero::before { width: 620px; height: 620px; left: -160px; top: -260px; background: #F15A22; }
.hero::after { width: 520px; height: 520px; right: -120px; bottom: -280px; background: #F15A22; opacity: .18; }
.hero .grain { position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(180deg, #000 0%, transparent 85%); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 85%); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(32px, 5vw, 72px); align-items: center; padding-top: clamp(56px, 9vw, 112px); padding-bottom: clamp(64px, 10vw, 128px); }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,.86); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: #7CF2B5; box-shadow: 0 0 0 4px rgba(124,242,181,.18); }
.hero h1 { font: 650 clamp(42px, 6vw, 80px)/1 var(--sans); letter-spacing: -.04em; margin: 22px 0 0; }
.hero h1 span { background: linear-gradient(120deg, #FF9C6E 0%, #FFC2A1 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.meta { display: flex; flex-wrap: wrap; gap: 10px; margin: 32px 0 36px; }
.meta div { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r-sm); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); font-size: 15px; font-weight: 500; }
.meta svg { width: 18px; height: 18px; color: #FF9C6E; flex: none; }
.meta small { display: block; font-size: 11.5px; color: rgba(255,255,255,.55); font-weight: 500; letter-spacing: .02em; }
.meta .tbd { color: rgba(255,255,255,.6); }
.hero-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.hero-cta .soon { font-size: 14px; color: rgba(255,255,255,.6); }
.hero-cta .soon b { color: #fff; }

/* vstupenka v úvodu */
.ticket { position: relative; justify-self: center; width: min(360px, 100%); color: var(--dark); transform: rotate(3deg); transition: transform .5s var(--ease); filter: drop-shadow(0 40px 60px rgba(0,0,0,.45)); }
.ticket:hover { transform: rotate(0deg) translateY(-4px); }
.t-top { background: var(--white); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 22px 24px 18px; }
.t-top .row { display: flex; justify-content: space-between; align-items: center; }
.t-top .k { font: 700 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted-2); }
.t-top .badge { font-size: 11.5px; font-weight: 600; color: var(--brand-d); background: var(--brand-soft); padding: 5px 9px; border-radius: 999px; }
.t-top h3 { font: 650 22px/1.15 var(--sans); letter-spacing: -.02em; margin: 14px 0 4px; }
.t-top p { margin: 0; color: var(--muted); font-size: 14px; }
.t-cut { position: relative; height: 22px; background: radial-gradient(circle at 0 50%, transparent 11px, var(--white) 11.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 11px, var(--white) 11.5px) right / 51% 100% no-repeat; }
.t-cut::after { content: ""; position: absolute; left: 20px; right: 20px; top: 50%; border-top: 2px dashed var(--gray-2); }
.t-bot { background: var(--white); border-radius: 0 0 var(--r-lg) var(--r-lg); padding: 14px 24px 24px; display: grid; grid-template-columns: 116px 1fr; gap: 18px; align-items: center; }
.t-qr { background: var(--white); border: 1px solid var(--gray-2); border-radius: 12px; padding: 8px; }
.t-qr canvas, .t-qr img, .t-qr table { width: 100% !important; height: auto !important; display: block; }
.t-bot dl { margin: 0; display: grid; gap: 10px; font-size: 13px; }
.t-bot dt { color: var(--muted-2); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.t-bot dd { margin: 2px 0 0; font-weight: 600; }
@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; }
  .ticket { transform: none; width: min(340px, 100%); justify-self: start; }
}
@media (max-width: 520px) { .meta div { flex: 1 1 calc(50% - 10px); } .hero-cta .btn { width: 100%; } }

/* ---------- přehled akcí klienta ---------- */
.client-hero .wrap { display: block; padding-bottom: clamp(56px, 8vw, 96px); }
.client-hero h1 { max-width: 16ch; }
.client-hero p { color: rgba(255,255,255,.7); font-size: 18px; margin: 18px 0 0; max-width: 48ch; }
.sec { padding: clamp(48px, 7vw, 96px) 0; }
.events { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: calc(-1 * clamp(80px, 9vw, 120px)); position: relative; }
.ev { display: flex; flex-direction: column; background: var(--white); border-radius: var(--r-lg); text-decoration: none; box-shadow: var(--shadow); border: 1px solid rgba(18,17,42,.05); transition: box-shadow .25s var(--ease), transform .25s var(--ease); overflow: hidden; }
.ev:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }
.ev-body { padding: 28px 28px 0; }
.ev-aud { font-size: 13px; font-weight: 600; color: var(--brand); }
.ev h3 { font: 650 24px/1.15 var(--sans); letter-spacing: -.02em; margin: 8px 0 0; }
.ev-date { display: flex; align-items: baseline; gap: 14px; margin: 24px 0 0; }
.ev-date b { font: 650 clamp(52px, 6vw, 72px)/.9 var(--sans); letter-spacing: -.05em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ev-date span { font-size: 15px; color: var(--muted); line-height: 1.35; }
.ev-date span strong { display: block; color: var(--dark); font-size: 18px; font-weight: 600; }
.ev-foot { margin-top: auto; padding: 24px 28px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ev-foot .tag { font-size: 13px; font-weight: 600; color: var(--ok); background: var(--ok-soft); padding: 6px 10px; border-radius: 999px; }
.ev-foot .go { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--dark); }
.ev-foot .go svg { width: 18px; height: 18px; color: var(--brand); transition: transform .25s var(--ease); }
.ev:hover .go svg { transform: translateX(4px); }

/* ---------- registrace ---------- */
.reg { padding: clamp(56px, 8vw, 104px) 0; scroll-margin-top: 72px; }
.reg-card { max-width: 760px; margin: 0 auto; }
.reg-head { text-align: center; margin-bottom: 28px; }
.reg-head h2 { font: 650 clamp(32px, 4vw, 44px)/1.08 var(--sans); letter-spacing: -.03em; margin: 14px 0 8px; }
.reg-head p { margin: 0; color: var(--muted); font-size: 17px; }
.form { background: var(--white); border-radius: var(--r-lg); padding: clamp(24px, 4vw, 44px); display: grid; gap: 24px; box-shadow: var(--shadow); border: 1px solid rgba(18,17,42,.05); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.fs { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
.fs legend { padding: 0; margin-bottom: 10px; }
.form-foot { display: grid; gap: 20px; padding-top: 22px; border-top: 1px solid var(--gray-2); }
.form-foot .btn { min-height: 58px; font-size: 16px; }
.form-err { background: var(--err-soft); color: var(--err); padding: 14px 16px; border-radius: var(--r-sm); font-weight: 500; font-size: 15px; }
.closed { background: var(--white); border-radius: var(--r-lg); padding: clamp(28px, 5vw, 48px); text-align: center; box-shadow: var(--shadow); }
.closed h3 { font: 650 26px/1.15 var(--sans); margin: 0 0 8px; }
.closed p { color: var(--muted); margin: 0; }

/* potvrzení */
.done { background: var(--white); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: 1fr 260px; }
.done-main { padding: clamp(28px, 4vw, 44px); }
.done .ico { width: 56px; height: 56px; border-radius: 18px; background: var(--ok); color: #fff; display: grid; place-items: center; box-shadow: 0 12px 24px -12px rgba(23,160,106,.8); }
.done .ico svg { width: 26px; height: 26px; }
.done h3 { font: 650 clamp(26px, 3.2vw, 34px)/1.1 var(--sans); letter-spacing: -.02em; margin: 22px 0 10px; }
.done p { color: var(--muted); font-size: 16.5px; margin: 0 0 8px; max-width: 44ch; }
.done .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.done-ticket { background: var(--dark); color: #fff; padding: 26px; display: grid; align-content: start; gap: 14px; position: relative; overflow: hidden; }
.done-ticket::before { content: ""; position: absolute; width: 260px; height: 260px; right: -120px; top: -120px; border-radius: 50%; background: #F15A22; filter: blur(60px); opacity: .5; }
.done-ticket > * { position: relative; }
.done-ticket .k { font: 700 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.55); }
.done-ticket .qr { background: #fff; padding: 10px; border-radius: 14px; }
.done-ticket .qr canvas, .done-ticket .qr img, .done-ticket .qr table { width: 100% !important; height: auto !important; display: block; }
.done-ticket b { font-size: 17px; }
.done-ticket small { color: rgba(255,255,255,.6); font-size: 13px; }
.sim-note { margin-top: 20px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: #FFF8DB; border: 1px dashed #E0B800; font-size: 14px; color: #5B4A00; }
@media (max-width: 760px) { .done { grid-template-columns: 1fr; } .done-ticket { grid-template-columns: 110px 1fr; align-items: center; } .done-ticket .k { grid-column: 1 / -1; } }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

.hp { position: absolute !important; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
.reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
.reveal.in { opacity: 1; transform: none; }
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="brandmark" id="homeLink" href="#"><i>Y</i><span><span id="agencyName">Yashica</span><small>Pořadatel akce</small></span></a>
    <nav class="head-nav" id="headNav" aria-label="Hlavní"></nav>
  </div>
</header>

<main id="app">
  <div class="page-state" id="loading"><span class="spinner" style="width:34px;height:34px;color:var(--brand)"></span></div>
</main>

<footer class="site-foot" id="foot" hidden>
  <div class="wrap">
    <span class="brandmark"><i>Y</i><span id="footAgency">Yashica</span></span>
    <span id="footText"></span>
  </div>
</footer>

<script src="vendor/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
(() => {
  const { $, $$, esc } = UI;
  const P = window.PLATFORM, F = API.fmt, route = window.LANDING_ROUTE;
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const IC = {
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 21V9l8-5 8 5v12M9 21v-6h6v6"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  };
  const TBD = '<span class="tbd">upřesníme</span>';
  let site = null, now = new Date();

  UI.demoBar('Fiktivní data · registrace funguje, e-mail se v demu neodesílá');
  $('#agencyName').textContent = P.AGENCY; $('#footAgency').textContent = P.AGENCY;
  $$('.brandmark i').forEach((x) => (x.textContent = (P.AGENCY || 'A')[0]));

  const daysTo = (iso) => Math.ceil((+API.dayDate(iso) - +new Date(now).setHours(0, 0, 0, 0)) / 864e5);
  const plural = (n, a, b, c) => n === 1 ? a : n > 1 && n < 5 ? b : c;
  const isPast = (ev) => daysTo(ev.date) < 0;
  const regOpen = (ev) => !isPast(ev) && (!ev.registration.deadline || now <= new Date(ev.registration.deadline));

  async function init() {
    if (!route.client) return notFound('Chybí adresa akce. Použijte prosím odkaz z pozvánky.');
    try {
      site = await API.call('site', { client: route.client, event: route.event });
    } catch (e) { return notFound(e.message); }
    now = new Date(site.now);
    const c = site.client;
    $('#homeLink').href = API.urls.client(c);
    $('#footText').innerHTML = `Akci pořádá <b style="color:#fff">${esc(P.AGENCY)}</b>${c.contact ? ` · Dotazy: <a href="mailto:${esc(c.contact)}">${esc(c.contact)}</a>` : ''}`;
    $('#foot').hidden = false;
    if (site.event) renderEvent(site.event); else renderClient();
    const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((x) => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 }) : null;
    $$('.reveal').forEach((el) => io ? io.observe(el) : el.classList.add('in'));
  }

  function notFound(msg) {
    document.title = 'Stránka nenalezena';
    $('#app').innerHTML = `<div class="page-state"><div><span class="label">Registrace</span><h1>Tuhle stránku jsme nenašli</h1><p>${esc(msg)}</p></div></div>`;
  }

  // ============ /klient – přehled akcí ============
  function renderClient() {
    const c = site.client;
    document.title = 'Akce pro zaměstnance · ' + c.name;
    $('#headNav').innerHTML = '';
    $('#app').innerHTML = `
      <section class="hero client-hero"><div class="grain"></div>
        <div class="wrap">
          <span class="pill"><i></i>Pozvánka</span>
          <h1>Akce pro zaměstnance <span>${esc(c.name)}</span></h1>
          <p>${site.events.length > 1 ? 'Vyberte akci podle lokality, kde pracujete.' : ''}</p>
        </div>
      </section>
      <section class="sec" style="padding-top:0">
        <div class="wrap"><div class="events">${site.events.map(eventCard).join('') || '<p>Momentálně tu nejsou žádné akce.</p>'}</div></div>
      </section>`;
  }
  function eventCard(ev) {
    const d = daysTo(ev.date);
    const tag = isPast(ev) ? 'Proběhlo' : !regOpen(ev) ? 'Registrace uzavřena' : 'Registrace otevřena';
    return `
      <a class="ev reveal" href="${esc(API.urls.event(site.client, ev))}">
        <div class="ev-body">
          <div class="ev-aud">${esc(ev.audience || '')}</div>
          <h3>${esc(ev.name)}</h3>
          <div class="ev-date"><b>${F.day(ev.date)}</b><span><strong>${esc(ev.city || '')}</strong>${F.long(ev.date)}</span></div>
        </div>
        <div class="ev-foot"><span class="tag">${tag}${d > 0 ? ' · za ' + d + ' ' + plural(d, 'den', 'dny', 'dní') : ''}</span><span class="go">Registrace ${ARROW}</span></div>
      </a>`;
  }

  // ============ /klient/akce – registrace ============
  function renderEvent(ev) {
    const c = site.client, r = ev.registration;
    const d = daysTo(ev.date);
    document.title = ev.name + ' · Registrace';
    if (site.events.length > 1) {
      $('#headNav').innerHTML = `<a class="back" href="${esc(API.urls.client(c))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Všechny akce</a>`;
    }
    if (regOpen(ev)) $('#headNav').insertAdjacentHTML('beforeend', '<a class="btn btn-primary" href="#registrace">Registrovat se</a>');

    // název akce: první část normálně, za čárkou zvýrazněná lokalita (např. „…, Dukovany“)
    const nm = String(ev.name), ci = nm.lastIndexOf(',');
    const title = ci > 0 ? `${esc(nm.slice(0, ci + 1))} <span>${esc(nm.slice(ci + 1).trim())}</span>` : esc(nm);

    $('#app').innerHTML = `
      <section class="hero"><div class="grain"></div>
        <div class="wrap">
          <div>
            <span class="pill"><i></i>${esc(ev.audience || 'Pozvánka')}</span>
            <h1>${title}</h1>
            <div class="meta">
              <div>${IC.cal}<span><small>Datum</small>${F.date(ev.date)}</span></div>
              <div>${IC.pin}<span><small>Lokalita</small>${ev.city ? esc(ev.city) : TBD}</span></div>
              <div>${IC.home}<span><small>Místo konání</small>${ev.venue ? esc(ev.venue) : TBD}</span></div>
              <div>${IC.clock}<span><small>Čas</small>${ev.time ? esc(ev.time) : TBD}</span></div>
            </div>
            <div class="hero-cta">
              ${regOpen(ev) ? `<a class="btn btn-primary" href="#registrace">Registrovat se ${ARROW}</a>` : ''}
              ${d > 0 ? `<span class="soon">Do akce zbývá <b>${d} ${plural(d, 'den', 'dny', 'dní')}</b></span>` : ''}
            </div>
          </div>
          <div class="ticket reveal" aria-hidden="true">
            <div class="t-top">
              <div class="row"><span class="k">Vstupenka</span><span class="badge">QR</span></div>
              <h3>${esc(ev.name)}</h3>
              <p>${F.long(ev.date)}</p>
            </div>
            <div class="t-cut"></div>
            <div class="t-bot">
              <div class="t-qr" id="heroQr"></div>
              <dl><div><dt>Jméno</dt><dd>Vaše jméno</dd></div><div><dt>Místo</dt><dd>${esc(ev.city || '')}</dd></div></dl>
            </div>
          </div>
        </div>
      </section>

      <section class="reg" id="registrace">
        <div class="wrap reg-card">
          <div class="reg-head reveal">
            <span class="label">Registrace</span>
            <h2>Registrujte se na akci</h2>
            <p>${esc(ev.name)} · ${F.date(ev.date)}</p>
          </div>
          <div id="regBox"></div>
        </div>
      </section>`;
    // ozdobný QR ve vstupence v úvodu = odkaz na tuto stránku (nic citlivého)
    UI.qr($('#heroQr'), API.urls.event(c, ev), { size: 220 });

    if (!regOpen(ev)) {
      $('#regBox').innerHTML = `<div class="closed"><h3>${isPast(ev) ? 'Akce už proběhla' : 'Registrace je uzavřená'}</h3><p>${c.contact ? 'Dotazy: ' + esc(c.contact) : 'S dotazy se obraťte na pořadatele.'}</p></div>`;
      return;
    }
    const doms = r.emailDomains || [];
    const chips = (name, list) => list.map((x, i) => `<label class="chip"><input type="radio" name="${name}" value="${esc(x)}" ${i === 0 ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('');
    $('#regBox').innerHTML = `
      <form class="form" id="regForm" novalidate>
        <div class="form-row">
          <label class="field"><span class="f-label">Jméno a příjmení</span>
            <input class="input" name="name" autocomplete="name" placeholder="Jan Novák" maxlength="80" required></label>
          <label class="field"><span class="f-label">${doms.length ? 'Firemní e-mail' : 'E-mail'}</span>
            <input class="input" name="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="${doms.length ? 'jmeno.prijmeni@' + esc(doms[0]) : 'jan.novak@email.cz'}" maxlength="120" required></label>
        </div>
        <fieldset class="fs"><legend class="f-label">Strava</legend><div class="chips">${chips('diet', r.diets)}</div></fieldset>
        <label class="field"><span class="f-label">Alergie nebo intolerance <small>(nepovinné)</small></span>
          <input class="input" name="allergies" placeholder="Např. ořechy, celer" maxlength="200"></label>
        ${(r.transport || []).length ? `<fieldset class="fs"><legend class="f-label">Doprava</legend><div class="chips">${chips('transport', r.transport)}</div></fieldset>` : ''}
        <div class="hp" aria-hidden="true"><label>Nevyplňujte<input name="website" tabindex="-1" autocomplete="off"></label></div>
        <div class="form-err" id="formErr" role="alert" hidden></div>
        <div class="form-foot">
          <label class="check"><input type="checkbox" name="consent"><span>Souhlasím se zpracováním údajů pro organizaci akce. Po akci budou smazány.</span></label>
          <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Odeslat registraci ${ARROW}</button>
        </div>
      </form>
      <div id="done" tabindex="-1" hidden></div>`;
    bindForm(ev);
  }

  function bindForm(ev) {
    const form = $('#regForm'), r = ev.registration, doms = r.emailDomains || [];
    function showErr(msg, field) {
      $('#formErr').textContent = msg; $('#formErr').hidden = false;
      $$('[aria-invalid]', form).forEach((x) => x.removeAttribute('aria-invalid'));
      if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); }
      else $('#formErr').scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    form.addEventListener('input', (e) => { if (e.target.hasAttribute('aria-invalid')) e.target.removeAttribute('aria-invalid'); });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#formErr').hidden = true;
      const f = form.elements;
      const name = f.name.value.replace(/\s+/g, ' ').trim();
      const email = f.email.value.trim().toLowerCase();
      if (name.split(' ').length < 2) return showErr('Napište prosím jméno i příjmení.', f.name);
      if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) return showErr('Zkontrolujte prosím e-mail.', f.email);
      if (doms.length && !doms.some((x) => email.endsWith('@' + x))) return showErr('Použijte prosím firemní e-mail (@' + doms.join(', @') + ').', f.email);
      if (!f.consent.checked) return showErr('Potvrďte prosím souhlas se zpracováním údajů.');
      const payload = {
        event: ev.id, name, email, allergies: f.allergies.value.trim(),
        website: f.website.value, consent: f.consent.checked,
        diet: ($('input[name=diet]:checked', form) || {}).value,
        transport: ($('input[name=transport]:checked', form) || {}).value || '',
        guests: 0,
      };
      const btn = $('#submitBtn'), label = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Odesílám…';
      try {
        const res = await API.call('register', payload);
        success(ev, res, payload);
      } catch (err) { showErr(err.message); }
      finally { btn.disabled = false; btn.innerHTML = label; }
    });
  }

  function success(ev, res, p) {
    const first = p.name.split(' ')[0];
    const ticketUrl = res.token ? API.urls.ticket(res.token) : '';
    const confirmed = ev.automations.confirm.confirmsAttendance;
    const done = $('#done');
    done.className = 'done';
    done.innerHTML = `
      <div class="done-main">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg></div>
        <h3>Hotovo, ${esc(first)}!</h3>
        <p>QR vstupenku posíláme na <b>${esc(p.email)}</b>. Pokud jste už registrovaní, přijde vám znovu.</p>
        <p>${confirmed ? 'Vaše účast je potvrzená.' : 'O potvrzení účasti vás požádáme e-mailem.'}</p>
        <div class="actions">
          ${ticketUrl ? `<a class="btn btn-primary" href="${esc(ticketUrl)}">Zobrazit vstupenku ${ARROW}</a>` : ''}
          <button class="btn btn-outline" type="button" id="again">Registrovat dalšího</button>
        </div>
        ${API.demo ? `<div class="sim-note"><span>🧪</span><span><b>Demo:</b> e-mail se neodesílá. Naostro přijde vstupenka s QR na zadaný e-mail.</span></div>` : ''}
      </div>
      ${ticketUrl ? `<div class="done-ticket"><span class="k">Vaše vstupenka</span><div class="qr" id="doneQr"></div><div><b>${esc(p.name)}</b><br><small>${F.date(ev.date)} · ${esc(ev.city || '')}</small></div></div>` : ''}`;
    if (ticketUrl) API.call('ticket', { token: res.token }).then((t) => UI.qr($('#doneQr'), t.ticket.qrText, { size: 300 })).catch(() => {});
    $('#regForm').hidden = true;
    done.hidden = false; done.focus();
    done.scrollIntoView({ block: 'start', behavior: 'smooth' });
    $('#again').addEventListener('click', () => {
      const form = $('#regForm'); form.reset();
      done.hidden = true; form.hidden = false; form.elements.name.focus();
    });
  }

  // „Registrovat se“ → plynule k přihlášce (stránka má <base>, takže „#registrace“ by jinak skočilo na úvod webu)
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href="#registrace"]');
    if (!a) return;
    e.preventDefault();
    const sec = document.getElementById('registrace');
    if (!sec) return;
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const first = sec.querySelector('input[name=name]');
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 500);
  });

  init();
})();
</script>
</body>
</html>
